# Alembic's configuration, for the operator who runs the `alembic`
# command directly. Athanore itself never reads this file: it builds an
# equivalent Config in `athanore.store.migrate.alembic_config`, which is
# what `athanore db upgrade` and the server's startup migration use.
#
#   alembic -c athanore/store/migrations/alembic.ini \
#       -x db_url=sqlite+aiosqlite:///athanore.db upgrade head
#
# There is no logging configuration here on purpose: Athanore configures
# structlog (`athanore.logging`), and `fileConfig` would replace it.

[alembic]
# This directory. Everything the environment needs is beside this file,
# so a wheel migrates its own database.
script_location = %(here)s

# `0001_v1_schema`, matching the revisions in versions/.
file_template = %%(rev)s_%%(slug)s

# Set on the command line (`-x db_url=...`) or here. Athanore passes it
# in `Config.attributes` instead, so that a password containing `%` is
# not read as a configparser interpolation.
sqlalchemy.url =
