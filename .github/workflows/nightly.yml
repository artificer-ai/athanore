# The Postgres half of the store suite. It is nightly rather than
# per-push because it needs a database: `compose --profile pg` provides
# it locally, a service container provides it here, and both hand the
# tests the same `ATHANORE_TEST_PG_URL`.
name: nightly

on:
  schedule:
    # 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: pytest -m postgres
    runs-on: ubuntu-latest

    services:
      # Same image and credentials as the `postgres` service of
      # compose.yaml, so a failure here reproduces with
      # `docker compose --profile pg up -d postgres`.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: athanore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ATHANORE_TEST_PG_URL: postgresql+asyncpg://postgres:athanore@127.0.0.1:5432/postgres
      # For real, not "for real if the database happens to be up" (T079).
      # `tests/store/conftest.py` skips the Postgres parameter when
      # nothing answers, which is right on a dev machine that has not run
      # `docker compose --profile pg up -d postgres` and wrong here,
      # where the service container is the whole point of the job: a
      # skip would be a green run that tested nothing. This variable
      # turns that skip into a failure (D191).
      ATHANORE_TEST_PG_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # `--all-extras` is what brings in asyncpg (the `postgres` extra).
      - name: uv sync
        run: uv sync --all-packages --all-groups --all-extras

      # The marker is registered in pyproject.toml and the tests it
      # selects arrived in T014, so an empty selection is now a failure
      # (exit 5) and not the pass D76 made it while there was nothing to
      # select: the carve-out in `tests/conftest.py` is gone (D191).
      # Between that and `ATHANORE_TEST_PG_REQUIRED`, the two ways this
      # job could be green having run nothing are both closed.
      - name: pytest -m postgres
        run: uv run --no-sync pytest -m postgres -q
