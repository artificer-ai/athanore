# The gate, on a runner. `./scripts/test.sh` is the definition of green
# (D74) and this file follows it: every check below is a check the gate
# runs, in the gate's order. The one departure is `--cov` on pytest,
# which measures rather than checks. If the two ever disagree about what
# green means, the gate is right and this file is wrong;
# `tests/test_ci_workflows.py` is what notices.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # uv sync, pytest on every supported interpreter; ruff, pyright and
  # lint-imports once, on 3.13. The floor (3.11) is tested, not just
  # declared in `requires-python` (D66).
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-groups --all-extras

      # `--cov` measures the whole package; the four steps below gate it.
      # Every threshold 13 §CI names is on now (T056): the three packages
      # at 95 % and the package as a whole at 85 %. They were deferred
      # until the code they measure existed, because a threshold on a
      # package that is four modules old fails on arithmetic rather than
      # on quality (D76).
      - name: pytest
        run: uv run --no-sync pytest -q --cov=athanore --cov-report=term-missing

      # One gate per package rather than one over all three, so a red
      # build names the package that slipped and a package cannot be
      # carried by its neighbours (D149). Each reports out of the data
      # file the step above wrote, so the suite runs once and the gate is
      # on the numbers the whole suite produced — `coverage report
      # --fail-under` is the flag `pytest --cov-fail-under` forwards to
      # (D112).
      - name: coverage gate (graph)
        run: >
          uv run --no-sync coverage report
          --include='athanore/graph/*' --fail-under=95

      - name: coverage gate (engine)
        run: >
          uv run --no-sync coverage report
          --include='athanore/engine/*' --fail-under=95

      - name: coverage gate (requests)
        run: >
          uv run --no-sync coverage report
          --include='athanore/requests/*' --fail-under=95

      # The whole package, 13 §CI's second threshold. No `--include`, so
      # it is every file `--cov=athanore` measured.
      - name: coverage gate (overall)
        run: uv run --no-sync coverage report --fail-under=85

      - name: ruff
        if: matrix.python-version == '3.13'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: pyright
        if: matrix.python-version == '3.13'
        run: uv run --no-sync pyright

      - name: lint-imports
        if: matrix.python-version == '3.13'
        run: uv run --no-sync lint-imports

  # The SPA half of the gate. `web/` arrives in T007; until it does this
  # job checks out, finds no `web/package.json`, and passes having run
  # nothing — the same thing `./scripts/test.sh` reports as
  # "skipped: web (no web/ yet — T007)".
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: is there a web/ yet?
        id: probe
        run: |
          if [ -f web/package.json ]; then
            echo "present=yes" >>"$GITHUB_OUTPUT"
          else
            echo "present=no" >>"$GITHUB_OUTPUT"
            echo "::notice::no web/package.json yet (T007); nothing to run"
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'yes'
        with:
          node-version: 22

      # Node 22 and `npm install -g pnpm@10`: the same two lines
      # `docker/dev/Dockerfile` runs, so the runner and the dev image
      # are the same toolchain.
      - name: pnpm
        if: steps.probe.outputs.present == 'yes'
        run: npm install --global --no-fund --no-audit pnpm@10

      - name: pnpm install
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web install --frozen-lockfile

      - name: pnpm typecheck
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web typecheck

      - name: pnpm lint
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web lint

      # `vitest run --coverage`, with the 80 % gate of 13 §Frontend and
      # T068 in `web/vite.config.ts`. The threshold is configured rather
      # than added here as a step of its own so that this job and
      # `./scripts/test.sh` (D74) apply the same one: both run this
      # command, and a gate only one of them enforced would be a gate
      # nobody noticed slipping (D177).
      - name: pnpm test
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web test

      - name: pnpm build
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web build

      # The E2E suite (T068a) drives the build above against a real
      # `athanore serve`, so this job needs the Python environment too:
      # the server is the subject, not a mock of one. Every agent in it
      # is `FakeACPAgent` (ATHANORE_AGENT_COMMAND), so no model is ever
      # in the loop.
      - uses: astral-sh/setup-uv@v6
        if: steps.probe.outputs.present == 'yes'
        with:
          python-version: "3.13"
          enable-cache: true

      - name: uv sync
        if: steps.probe.outputs.present == 'yes'
        run: uv sync --all-packages --all-groups --all-extras

      # Chromium only, as T068a asks: one engine, the same one
      # `docker/dev/Dockerfile` bakes into the dev image (D68), pinned by
      # the `@playwright/test` in `web/package.json`.
      - name: playwright browser
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: pnpm e2e
        if: steps.probe.outputs.present == 'yes'
        run: pnpm -C web exec playwright test

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.present == 'yes' && failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # One wire contract: OpenAPI is generated from the code and the
  # TypeScript client from OpenAPI, both committed. This job regenerates
  # them and fails if the tree is stale. Both generators exist as of
  # T008, so unlike `web` above there is no probe: a contract check that
  # can silently skip itself is not a contract check.
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm
        run: npm install --global --no-fund --no-audit pnpm@10

      # `pnpm gen` dumps the document and then runs the codegen, so the
      # explicit dump is only there to do it in an environment `uv sync`
      # has just prepared.
      - name: regenerate
        run: |
          uv sync --all-packages --all-groups --all-extras
          uv run --no-sync scripts/dump_openapi.py
          pnpm -C web install --frozen-lockfile
          pnpm -C web gen

      - name: snapshot and client are fresh
        run: git diff --exit-code tests/snapshots web/src/api/gen
