[project]
name = "athanore-examples"
version = "1.0.0a0"
description = "Example workflows and vendor adapters for Athanore"
requires-python = ">=3.11"
dependencies = ["athanore"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package so far. The rest (feature_build, gamedev, msgtest,
# claude_acp, docker_acp, projects) arrive in T074-T076 and are added
# here as they land.
packages = ["pi"]

[tool.uv.sources]
athanore = { workspace = true }
