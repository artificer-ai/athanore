[project]
name = "athanore-examples"
version = "1.0.0a0"
description = "Example workflows and vendor adapters for Athanore"
requires-python = ">=3.13"
dependencies = ["athanore"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No modules yet: the example packages (feature_build, gamedev, msgtest,
# claude_acp, docker_acp, projects) arrive in T074-T076, which replaces
# this with a real package list.
bypass-selection = true

[tool.uv.sources]
athanore = { workspace = true }
