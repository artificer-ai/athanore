[project]
name = "athanore-examples"
version = "1.0.0a0"
description = "Example workflows and vendor adapters for Athanore"
requires-python = ">=3.11"
dependencies = ["athanore"]

# How `athanore serve` finds these workflows with nothing on its command
# line (09 §Discovery, T072). The left-hand side is what this
# distribution calls the entry; the name a run is submitted under is the
# `Workflow`'s own, and they are kept equal here because there is no
# reason for them to differ (D184).
[project.entry-points."athanore.workflows"]
feature_build = "feature_build:wf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The workflows and the adapters, one package each. The rest (gamedev,
# msgtest, claude_acp, docker_acp, projects) arrive in T075-T076 and are
# added here as they land.
packages = ["feature_build", "pi"]

[tool.uv.sources]
athanore = { workspace = true }
