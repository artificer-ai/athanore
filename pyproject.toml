[project]
name = "athanore"
version = "1.0.0a0"
description = "Code-defined AI agent workflows over ACP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.12,<0.13",
    "aiosqlite",
    "alembic",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings",
    "python-ulid",
    "rich",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette",
    "structlog",
    "typer",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
postgres = ["asyncpg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun",
    "hypothesis",
    "import-linter",
    "pip-audit",
    "pyright",
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "pyyaml",
    "respx",
    "ruff",
]

[tool.uv.workspace]
members = ["examples"]
# driver/ is athanore **v0** (the MVP driving this build). Same
# distribution name as this project, so it must never resolve into this
# workspace's environment (D67).
exclude = ["driver"]

# The SPA build output is git-ignored but ships in the wheel (14). It is
# declared here rather than under `targets.wheel` because `uv build`
# builds the wheel from the sdist: a file the sdist drops can never reach
# the wheel, and `.gitignore`'s `athanore/web/dist/*` drops all of them.
[tool.hatch.build]
artifacts = ["athanore/web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["athanore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # The Postgres variants of the store suite (T014). Selected by the
    # nightly workflow and by `pytest -m postgres` against
    # `compose --profile pg`; registered here so the marker is never a
    # typo that silently selects nothing.
    "postgres: needs a live Postgres at ATHANORE_TEST_PG_URL",
]

[tool.ruff]
line-length = 88
# Spec documents hold hand-aligned Python snippets as illustration, not
# as importable source; the formatter's markdown code-block pass would
# churn them on every run (D73).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
typeCheckingMode = "standard"
strict = ["athanore/graph", "athanore/engine", "athanore/store"]
# driver/ is athanore **v0** (D67): it imports the sibling v0 distribution
# whose symbols do not exist in v1 yet, so type-checking it against v1's
# package can only produce false positives (D73).
exclude = ["driver"]

[tool.importlinter]
root_package = "athanore"

[[tool.importlinter.contracts]]
name = "Layering: arrows point down only"
type = "layers"
# One tier per entry, top to bottom. `|` separates independent sibling
# modules, so peers within a tier may not import each other; the only
# cross-module imports allowed are arrows down a tier. `(…)` marks a
# module that does not exist yet (created in T049/T050).
layers = [
    "athanore.api | athanore.cli | athanore.plugins.builtin",
    "athanore.engine | athanore.requests | athanore.agents | (athanore.plugins.registry) | (athanore.plugins.decl) | (athanore.plugins.mount)",
    "athanore.store | athanore.events | athanore.graph | athanore.settings | athanore.logging",
]
# The arrows across the middle tier, and they all point at the same
# module (D117, D119). `TaskContext` is where a body's identity and its
# narrow services live, and 02 §Layering has both siblings reaching it —
# "`agents` reaches the store only through `TaskContext`" — so a helper a
# node body calls needs `current_task()`, an agent façade needs the
# context it declares its `output_model` on, and there is nowhere lower
# to get either from. They stay named arrows rather than a `:` between
# the siblings: `engine.context` is a contextvar and a dataclass, the
# engine still may not import back (`RequestsPort` is a protocol for that
# reason), and no module in the tier reaches any further into a peer than
# this. An entry that stops matching an import is an error, so an
# exemption cannot outlive the import it names.
ignore_imports = [
    "athanore.requests.human -> athanore.engine.context",
    "athanore.agents.base -> athanore.engine.context",
    "athanore.agents.submissions -> athanore.engine.context",
]

[[tool.importlinter.contracts]]
name = "graph imports nothing from athanore"
type = "forbidden"
# `athanore.graph` is a subpackage of the root `athanore`, so the default
# `as_packages` overlap rule skips the root module as an ancestor rather
# than forbidding it. `as_packages = false` restores the check, at which
# point the source must enumerate graph's own modules (`athanore.graph` plus
# its `**` descendants) because the package form no longer expands them.
source_modules = ["athanore.graph", "athanore.graph.**"]
forbidden_modules = ["athanore", "athanore.*"]
as_packages = false

[[tool.importlinter.contracts]]
name = "agents may not import store"
type = "forbidden"
source_modules = ["athanore.agents"]
forbidden_modules = ["athanore.store"]
# Direct imports only (D119). 02 §Layering does not say `agents` may not
# reach the store; it says it "reaches the store only through
# `TaskContext` (which exposes narrow services, not the store object)" —
# and `TaskContext` is a dataclass whose `services` are typed with store
# rows, so the sanctioned path is itself an indirect `agents ->
# engine.context -> engine.services -> store.rows`. Forbidding that chain
# would forbid the one arrow the architecture grants. What must stay
# impossible is the direct import — a façade opening a `uow`, writing a
# row, or naming a table — and that is what this contract now says. The
# layers contract above is what keeps the indirection to one module:
# `engine.context` is the only peer any of these siblings may name.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "store may not import engine"
type = "forbidden"
source_modules = ["athanore.store"]
forbidden_modules = ["athanore.engine"]
