[project]
name = "athanore"
version = "1.0.0a0"
description = "Code-defined AI agent workflows over ACP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.12,<0.13",
    "aiosqlite",
    "alembic",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings",
    "python-ulid",
    "rich",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette",
    "structlog",
    "typer",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
postgres = ["asyncpg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun",
    "hypothesis",
    "import-linter",
    "pip-audit",
    "pyright",
    "pytest>=8",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.uv.workspace]
members = ["examples"]

[tool.hatch.build.targets.wheel]
packages = ["athanore"]
# The SPA build output is git-ignored but ships in the wheel (14).
artifacts = ["athanore/web/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
