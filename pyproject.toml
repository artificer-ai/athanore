[project]
name = "athanore"
version = "1.1.0"
description = "Code-defined AI agent workflows over ACP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.12,<0.13",
    "aiosqlite",
    "alembic",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1,<3",
    "pydantic>=2.7",
    "pydantic-settings",
    "python-ulid",
    "rich",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette",
    "structlog",
    "typer",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
postgres = ["asyncpg"]

# The command 11 documents. It names `main`, which returns the exit
# status of 11 §Exit codes; the generated script is what turns that into
# `sys.exit`. `python -m athanore.cli` reaches the same function without
# a regenerated script, which is what the subprocess tests use.
[project.scripts]
athanore = "athanore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun",
    "hypothesis",
    "import-linter",
    "pip-audit",
    "pyright",
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "pyyaml",
    "respx",
    "ruff",
]

[tool.uv.workspace]
members = ["examples"]

# The SPA build output is git-ignored but ships in the wheel (14). It is
# declared here rather than under `targets.wheel` because `uv build`
# builds the wheel from the sdist: a file the sdist drops can never reach
# the wheel, and `.gitignore`'s `athanore/web/dist/*` drops all of them.
[tool.hatch.build]
artifacts = ["athanore/web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["athanore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The examples are a workspace package with its own suite, and the gate
# is one command (D74): `uv run pytest` collects both, and `uv sync
# --all-packages` is what puts `pi` on the path for the second.
testpaths = ["tests", "examples/tests"]
markers = [
    # The Postgres variants of the store suite (T014). Selected by the
    # nightly workflow and by `pytest -m postgres` against
    # `compose --profile pg`; registered here so the marker is never a
    # typo that silently selects nothing.
    "postgres: needs a live Postgres at ATHANORE_TEST_PG_URL",
]

[tool.ruff]
line-length = 88
# Spec documents hold hand-aligned Python snippets as illustration, not
# as importable source; the formatter's markdown code-block pass would
# churn them on every run (D73).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# `pi` and the example workflows are this workspace's own packages, not
# dependencies: ruff infers `athanore` as first-party from the source tree
# and would otherwise sort an example's own imports in among pytest's.
known-first-party = [
    "athanore",
    "claude_acp",
    "docker_acp",
    "pi",
]

[tool.pyright]
typeCheckingMode = "standard"
strict = ["athanore/graph", "athanore/engine", "athanore/store"]
# Pyright *replaces* its default exclude list when this key is set, so
# the defaults are restated here. Without `**/.*` a host `.venv` —
# which the stack invites you to keep for your editor — is walked as
# source, and the pyright step goes from seconds to over an hour
# (D173).
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]

[tool.importlinter]
root_package = "athanore"

[[tool.importlinter.contracts]]
name = "Layering: arrows point down only"
type = "layers"
# One tier per entry, top to bottom. `|` separates independent sibling
# modules, so peers within a tier may not import each other; the only
# cross-module imports allowed are arrows down a tier.
#
# The plugin host is three tiers of its own between `api` and `engine`
# (D138): `mount` builds routers out of `context`, `context` resolves a
# handler's scope out of the engine and the store, and `registry`
# validates declarations that `decl` — pure data, pydantic and nothing
# else — sits at the bottom with `graph`. Those two are what
# `workflow.py` and `registry` join, and why 02 §Layering names
# `plugins.decl` beside `graph`.
#
# `athanore.server` is the composition root (T051), so it is a tier of
# its own above everything: it builds the store, the engine and the
# application and hands them to each other, and nothing may import it
# back.
layers = [
    "athanore.server",
    "athanore.api | athanore.cli | athanore.plugins.builtin",
    "athanore.plugins.mount",
    "athanore.plugins.context",
    "athanore.engine | athanore.requests | athanore.agents | athanore.plugins.registry",
    "athanore.store | athanore.events | athanore.graph | athanore.settings | athanore.logging | athanore.plugins.decl",
]
# The arrows across the middle tier, and they all point at the same
# module (D117, D119). `TaskContext` is where a body's identity and its
# narrow services live, and 02 §Layering has both siblings reaching it —
# "`agents` reaches the store only through `TaskContext`" — so a helper a
# node body calls needs `current_task()`, an agent façade needs the
# context it declares its `output_model` on, and there is nowhere lower
# to get either from. They stay named arrows rather than a `:` between
# the siblings: `engine.context` is a contextvar and a dataclass, the
# engine still may not import back (`RequestsPort` is a protocol for that
# reason), and no module in the tier reaches any further into a peer than
# this. An entry that stops matching an import is an error, so an
# exemption cannot outlive the import it names.
ignore_imports = [
    "athanore.requests.human -> athanore.engine.context",
    "athanore.agents.base -> athanore.engine.context",
    "athanore.agents.submissions -> athanore.engine.context",
    "athanore.agents.stats -> athanore.engine.context",
    "athanore.agents.policies -> athanore.engine.context",
    "athanore.agents.acp -> athanore.engine.context",
    # The two arrows back up into the API, and the only ones (D138). A
    # plugin route is an operator route: it hangs on the API's own door
    # (`operator_auth`) and declares the API's own security requirement,
    # and there is no lower place to put a door that has to be the same
    # one. Everything else `mount` needs — the specs, the context, the
    # bus — it takes from below.
    "athanore.plugins.mount -> athanore.api.deps",
    "athanore.plugins.mount -> athanore.api.openapi",
    # `athanore serve` is the composition root's command line (11
    # §Server): it builds a `Server`, registers the workflows its targets
    # name and calls `serve()`, so it is the same arrow `Workflow.run`
    # draws and it is deferred for the same reason. Written inside the
    # command body, `athanore db`, `athanore token` and `athanore login`
    # — the verbs that repair an installation whose server will not start
    # — never pull in uvicorn, the API and the store to parse a flag.
    "athanore.cli.serve -> athanore.server",
    # `athanore/__init__.py` is the public surface of 02 §Public API, and
    # `agents.acp` is the one module inside a tier that imports it: the
    # ACP handshake sends this implementation's version, so it reads
    # `__version__` off the package root (05 §Session lifecycle). The
    # root is *above* every tier — it re-exports `Server`, `Pool` and the
    # rest — so grimp reads that one line as `agents -> engine`,
    # `agents -> requests`, `agents -> plugins.context` and
    # `agents -> server`, four arrows nothing executes. It imports
    # nothing at runtime: every name is resolved on attribute access
    # through a module `__getattr__` (D148), and
    # `tests/test_public_api.py` asserts in a fresh interpreter that
    # importing `athanore` pulls in no server, no API and no store.
    "athanore.agents.acp -> athanore",
    # The one arrow back up into the composition root, and the reason it
    # is written inside `Workflow.run` rather than at module scope:
    # `wf.run()` is 04 §Programmatic host's shorthand for "build a
    # `Server`, register this, serve", so the module that defines a
    # workflow would otherwise pull in uvicorn, the API and the store to
    # let an author declare a node. Deferred to call time, it is an
    # arrow no import of `athanore.workflow` ever follows.
    "athanore.workflow -> athanore.server",
]

[[tool.importlinter.contracts]]
name = "graph imports nothing from athanore"
type = "forbidden"
# `athanore.graph` is a subpackage of the root `athanore`, so the default
# `as_packages` overlap rule skips the root module as an ancestor rather
# than forbidding it. `as_packages = false` restores the check, at which
# point the source must enumerate graph's own modules (`athanore.graph` plus
# its `**` descendants) because the package form no longer expands them.
source_modules = ["athanore.graph", "athanore.graph.**"]
forbidden_modules = ["athanore", "athanore.*"]
as_packages = false

[[tool.importlinter.contracts]]
name = "agents may not import store"
type = "forbidden"
source_modules = ["athanore.agents"]
forbidden_modules = ["athanore.store"]
# Direct imports only (D119). 02 §Layering does not say `agents` may not
# reach the store; it says it "reaches the store only through
# `TaskContext` (which exposes narrow services, not the store object)" —
# and `TaskContext` is a dataclass whose `services` are typed with store
# rows, so the sanctioned path is itself an indirect `agents ->
# engine.context -> engine.services -> store.rows`. Forbidding that chain
# would forbid the one arrow the architecture grants. What must stay
# impossible is the direct import — a façade opening a `uow`, writing a
# row, or naming a table — and that is what this contract now says. The
# layers contract above is what keeps the indirection to one module:
# `engine.context` is the only peer any of these siblings may name.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "store may not import engine"
type = "forbidden"
source_modules = ["athanore.store"]
forbidden_modules = ["athanore.engine"]
